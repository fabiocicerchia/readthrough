[project]
name = "codescan"
version = "1.0.0"
description = "Multi-pass LLM code audit with resumable state and coverage accounting"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40"]

[project.scripts]
codescan = "codescan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
