name: codescan

# Reviews only the files changed in a PR. Small scope, fast, and the author
# still has the code in their head. Copy this into each repo.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write   # required to upload SARIF

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install codescan
        run: |
          git clone --depth 1 https://github.com/YOUR_ORG/codescan.git /tmp/codescan
          pip install -e /tmp/codescan

      - name: Collect changed files
        id: changed
        run: |
          git diff --name-only --diff-filter=ACMR \
            origin/${{ github.base_ref }}...HEAD > /tmp/changed.txt
          echo "count=$(wc -l < /tmp/changed.txt)" >> "$GITHUB_OUTPUT"
          cat /tmp/changed.txt

      - name: Stage changed files
        if: steps.changed.outputs.count != '0'
        run: |
          mkdir -p /tmp/subject
          while read -r f; do
            [ -f "$f" ] || continue
            mkdir -p "/tmp/subject/$(dirname "$f")"
            cp "$f" "/tmp/subject/$f"
          done < /tmp/changed.txt

      - name: Audit
        if: steps.changed.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          codescan scan /tmp/subject \
            --out /tmp/report \
            --lenses injection,authz,logic,errors \
            --verify --verify-min-severity high \
            --workers 4 --quiet

      - name: Upload SARIF
        if: steps.changed.outputs.count != '0'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /tmp/report/findings.sarif
          category: codescan

      - name: Job summary
        if: always() && steps.changed.outputs.count != '0'
        run: cat /tmp/report/report.md >> "$GITHUB_STEP_SUMMARY"

      # Advisory by default. To block merges on critical findings, uncomment:
      # - name: Gate on critical findings
      #   run: |
      #     n=$(python -c "import json;d=json.load(open('/tmp/report/findings.json'));\
      #     print(sum(1 for f in d['findings'] if f['severity']=='critical' \
      #     and f.get('verdict')!='rejected'))")
      #     [ "$n" -eq 0 ] || { echo "$n critical finding(s)"; exit 1; }
