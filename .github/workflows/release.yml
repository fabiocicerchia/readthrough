name: release

# release-please reads Conventional Commit messages on main and keeps an open
# "release PR" with the next version bump + CHANGELOG. Merging that PR cuts the
# release (vX.Y.Z tag + GitHub Release). Nothing else to run.
#
# Why this is two release-please jobs and not one — do not collapse them back:
#
# Repos in this portfolio cut a *draft* release ("draft": true in
# release-please-config.json), because releases are immutable and assets can
# only be attached while the release is still a draft. The draft is therefore
# published last, once its assets are on it.
#
# A draft release has no git tag — publishing it is what creates the tag. A
# single release-please invocation cuts the release and then, in the same run,
# computes the next release PR. That second half would run while the release is
# still a draft: no tag exists for the version already written to
# .release-please-manifest.json, so release-please finds no anchor, walks the
# entire commit history, and opens a release PR that re-releases everything.
# Merging it cuts another release, which opens another PR, forever.
#
# So the next release PR must be computed *after* the draft is published:
#
#   release-please   phase 1 — cut the (draft) release only
#   <per-repo jobs>  build assets, attach them, publish the draft -> tag exists
#   release-pr       phase 2 — open/update the next release PR only

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Phase 1 — cut the release for a just-merged release PR. No release PR is
  # computed here; `release-pr` does that once the tag exists.
  release-please:
    permissions:
      contents: write # create tags & releases
      pull-requests: write # label the merged release PR (autorelease: tagged)
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          # "simple" is language-agnostic (tracks version.txt + CHANGELOG).
          # Swap for node/python/rust/etc. to also bump manifests. Repos that
          # need "draft": true use manifest mode instead — the action has no
          # `draft` input — and pass `config-file:`/`manifest-file:` here.
          release-type: simple
          skip-github-pull-request: true

  # Per-repo jobs belong between the two phases: build the artifacts, attach
  # them to the draft (`gh release upload "$TAG" ...`), then publish it. Wire
  # them into `publish-release`'s `needs:` so the draft is published last.

  # Publishing the draft creates the git tag that phase 2 anchors on. A no-op
  # when the release was never a draft: `--draft=false` on a published release
  # succeeds and changes nothing.
  publish-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # flip the draft to published
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  # Phase 2 — open/update the next release PR, now that the tag exists.
  #
  # `always()` because on an ordinary push no release PR was merged, so
  # `release-please` reports no release and `publish-release` is skipped — the
  # release PR still has to be kept up to date. When a release *was* cut,
  # `publish-release` must have succeeded: testing `!= 'failure'` would let
  # this run when publishing was *skipped* because a job it needs failed,
  # which leaves the release a draft with no tag to anchor on — the very loop
  # this split exists to prevent.
  release-pr:
    needs: [release-please, publish-release]
    if: always()
      && needs.release-please.result == 'success'
      && (needs.release-please.outputs.release_created != 'true'
      || needs.publish-release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # open/update the release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          # Must match phase 1's configuration exactly — same release-type, or
          # the same config-file/manifest-file pair.
          release-type: simple
          skip-github-release: true
