name: docker-build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Publish only from the default branch and from version tags. Defined
      # once because the login step and the build step must agree: if they
      # disagree, the build tries to push without a session and fails.
      #
      # `github.event_name != 'pull_request'` is NOT this condition — it is
      # also true for a push to any feature branch and for workflow_dispatch,
      # which would publish a `type=ref,event=branch` image per branch.
      PUBLISH: >-
        ${{ github.event_name == 'push'
            && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
                || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        id: meta
        with:
          images: ghcr.io/fabiocicerchia/readthrough
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      # A PR build proves the image compiles without publishing anything.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
